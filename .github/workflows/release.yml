# Pushing a tag such as v0.1.0 or v0.1.0-beta.1 tests the code, builds the
# tarball and .deb with scripts/release, and publishes them as a GitHub
# release. Tags with a pre-release part (-beta.1) are marked as
# pre-releases. Release notes are the tag's section of CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # 24.04 ships libadwaita 1.5, the version the GUI's bindings are pinned to.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GTK and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libgirepository1.0-dev dpkg-dev

      - name: Test
        run: go test ./...

      - name: Build
        run: scripts/release "$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # This tag's section of CHANGELOG.md, without its heading.
          awk -v tag="$TAG" '
            /^## / { if (found) exit; found = index($0, "## " tag " ") == 1; next }
            found' CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no section for $TAG" >&2
            exit 1
          fi
          pre=
          case "$TAG" in *-*) pre=--prerelease ;; esac
          gh release create "$TAG" dist/* --title "Tidy It $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" $pre
